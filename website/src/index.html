<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>ResponseResultHandler: Results, not exceptions</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ResponseResultHandler: a Result-pattern library for .NET with ASP.NET Core and RFC 9457 Problem Details support.">
  <meta name="theme-color" content="#0c0a18">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem('rh-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-bs-theme', t);
      else if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.setAttribute('data-bs-theme', 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <rh-root></rh-root>
</body>
</html>
