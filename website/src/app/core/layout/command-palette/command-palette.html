@if (palette.isOpen()) {
  <div class="backdrop" (click)="close()"></div>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search">
    <div class="search-row">
      <i class="bi bi-search"></i>
      <input #queryInput type="text" placeholder="Search docs, statuses, tools…" aria-label="Search" autocomplete="off"
             role="combobox" aria-controls="palette-results" [attr.aria-activedescendant]="'hit-' + cursor()"
             [value]="query()" (input)="query.set($any($event.target).value)" (keydown)="onKey($event)">
      <kbd>Esc</kbd>
      <button type="button" class="btn btn-sm btn-ghost d-sm-none" (click)="close()" aria-label="Close search"><i class="bi bi-x-lg"></i></button>
    </div>
    <ul id="palette-results" class="results list-unstyled" role="listbox">
      @for (hit of hits(); track $index) {
        <li [id]="'hit-' + $index" role="option" [attr.aria-selected]="$index === cursor()">
          <button type="button" class="hit" [class.active]="$index === cursor()" (click)="go(hit)" (mouseenter)="cursor.set($index)">
            <span class="icon-tile sm"><i class="bi" [class]="hit.icon"></i></span>
            <span class="flex-grow-1 min-w-0 text-start">
              <span class="d-block fw-semibold text-truncate">{{ hit.title }}</span>
              <small class="d-block text-muted-rh text-truncate">{{ hit.subtitle }}</small>
            </span>
            <span class="cat">{{ hit.category }}</span>
          </button>
        </li>
      } @empty {
        <li class="empty">No results for “{{ query() }}”.</li>
      }
    </ul>
    <div class="foot">
      <kbd>↑</kbd><kbd>↓</kbd> navigate <kbd>↵</kbd> open <kbd>/</kbd> or <kbd>{{ keyboard.modifier() }} K</kbd> toggle
    </div>
  </div>
}
