name: publish

on:
  push:
    branches: [master, beta]
    paths:
      - 'src/**'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          # <Version> in ResultHandler.csproj is the full target version - bump it by hand per release.
          # beta appends -beta.<run_number> to preview that same version (12.2.0-beta.5 < 12.2.0).
          # Bump <Version> BEFORE the first beta of a release, not after.
          $version = (dotnet msbuild src/ResultHandler/ResultHandler.csproj -getProperty:Version).Trim()
          if ("${{ github.ref_name }}" -eq "beta") {
            $version = "$version-beta.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ResponseUtilityLibrary.sln -p:IsPublishBuild=true

      - name: Build
        run: dotnet build ResponseUtilityLibrary.sln --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:IsPublishBuild=true

      - name: Test
        run: dotnet test test/ResultHandler.Tests/ResultHandler.Tests.csproj --no-build --configuration Release

      - name: Pack
        run: dotnet pack ResponseUtilityLibrary.sln --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:IsPublishBuild=true --output ./nupkgs

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./nupkgs -Filter *.nupkg
          if (-not $packages) {
            throw "No .nupkg files found in ./nupkgs"
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
