name: publish

on:
  push:
    branches: [master, beta]
    paths:
      - 'src/**'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          # <Version> in ResultHandler.csproj is the source of truth for major.minor only (bump it
          # by hand for a real API change); both packages are bumped in lockstep and built with the
          # same -p:Version= below, so reading it from this one project is sufficient. The patch
          # number always comes from run_number instead of the csproj, so every publish gets a
          # version nobody has used before — no more manual patch bumps, no more collisions with an
          # already-published version silently no-op'd by --skip-duplicate.
          $csprojVersion = (dotnet msbuild src/ResultHandler/ResultHandler.csproj -getProperty:Version).Trim()
          $majorMinor = ($csprojVersion -split '\.')[0..1] -join '.'
          $version = "$majorMinor.${{ github.run_number }}"
          if ("${{ github.ref_name }}" -eq "beta") {
            $version = "$version-beta.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ResponseUtilityLibrary.sln -p:IsPublishBuild=true

      - name: Build
        run: dotnet build ResponseUtilityLibrary.sln --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:IsPublishBuild=true

      - name: Test
        run: dotnet test test/ResultHandler.Tests/ResultHandler.Tests.csproj --no-build --configuration Release

      - name: Pack
        run: dotnet pack ResponseUtilityLibrary.sln --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:IsPublishBuild=true --output ./nupkgs

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./nupkgs -Filter *.nupkg
          if (-not $packages) {
            throw "No .nupkg files found in ./nupkgs"
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
