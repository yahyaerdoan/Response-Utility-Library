name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ResponseUtilityLibrary.sln

      - name: Build
        run: dotnet build ResponseUtilityLibrary.sln --no-restore --configuration Release

      - name: Test
        shell: pwsh
        run: |
          foreach ($tfm in @('net8.0', 'net9.0', 'net10.0')) {
            dotnet test test/ResultHandler.Tests/ResultHandler.Tests.csproj -f $tfm --no-build --configuration Release --results-directory test/ResultHandler.Tests/TestResults --report-xunit-trx --report-xunit-trx-filename "test-results.$tfm.trx"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test/ResultHandler.Tests/TestResults/*.trx
