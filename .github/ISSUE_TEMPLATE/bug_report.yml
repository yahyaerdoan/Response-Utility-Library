name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: ResponseResultHandler.AspNetCore 16.0.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: .NET version
      placeholder: net10.0
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Code that reproduces it
      description: The smallest code that shows the problem.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
